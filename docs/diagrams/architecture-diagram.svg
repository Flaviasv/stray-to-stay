<!-- note -->
<g id="node7" class="node">
<title>note</title>
<polygon fill="#fffdf0" stroke="transparent" points="686,-469 686,-633 882,-633 882,-469 686,-469"/>
<text text-anchor="start" x="695" y="-616.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Layering rule</text>
<text text-anchor="start" x="695" y="-590.8" font-family="Helvetica,sans-Serif" font-size="9.00">Each layer depends only on the layer</text>
<text text-anchor="start" x="695" y="-580.8" font-family="Helvetica,sans-Serif" font-size="9.00">directly below it. A JSP never reaches</text>
<text text-anchor="start" x="695" y="-570.8" font-family="Helvetica,sans-Serif" font-size="9.00">the database; a DAO never knows a</text>
<text text-anchor="start" x="695" y="-560.8" font-family="Helvetica,sans-Serif" font-size="9.00">request exists.</text>
<text text-anchor="start" x="695" y="-536.2" font-family="Helvetica,sans-Serif" font-weight="bold" font-size="11.00">Scaling path</text>
<text text-anchor="start" x="695" y="-510.8" font-family="Helvetica,sans-Serif" font-size="9.00">Because almost no state is held in</text>
<text text-anchor="start" x="695" y="-500.8" font-family="Helvetica,sans-Serif" font-size="9.00">memory, the app container can be run</text>
<text text-anchor="start" x="695" y="-490.8" font-family="Helvetica,sans-Serif" font-size="9.00">N times behind a load balancer</text>
<text text-anchor="start" x="695" y="-480.8" font-family="Helvetica,sans-Serif" font-size="9.00">without code changes.</text>
<polygon fill="none" stroke="black" points="686,-469 686,-633 882,-633 882,-469 686,-469"/>
</g>
