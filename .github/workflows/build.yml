name: Build

# Every PR into test or main must compile and pass the unit tests.
on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]

jobs:
  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: mvn -B package

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: straytostay-war
          path: target/straytostay.war
          retention-days: 7
